<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330">
  <defs>
    <marker id="farrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="black"/>
    </marker>
    <style>
      .ftext { font-family: Helvetica, Arial, sans-serif; font-size: 14px; dominant-baseline: middle; text-anchor: middle; }
      .fsmall { font-family: Helvetica, Arial, sans-serif; font-size: 12px; dominant-baseline: middle; text-anchor: middle; fill: #555; }
      .fmet { fill: #d6e6ff; stroke: black; stroke-width: 1.2; }
      .fext { fill: #f4cccc; stroke: black; stroke-width: 1.2; }
      .fcell { fill: none; stroke: #888; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <!-- cell boundary -->
  <rect x="150" y="20" width="560" height="290" rx="25" class="fcell"/>
  <text x="180" y="35" class="fsmall">cell</text>

  <!-- external metabolites -->
  <rect x="20" y="70" width="80" height="34" class="fext"/>
  <text x="60" y="87" class="ftext">O₂ (ext)</text>
  <rect x="20" y="180" width="80" height="34" class="fext"/>
  <text x="60" y="197" class="ftext">Glc (ext)</text>
  <rect x="760" y="240" width="80" height="34" class="fext"/>
  <text x="800" y="257" class="ftext">Lac (ext)</text>
  <rect x="760" y="70" width="90" height="34" class="fext"/>
  <text x="805" y="87" class="ftext">work</text>

  <!-- internal metabolites -->
  <rect x="200" y="70" width="70" height="34" class="fmet"/>
  <text x="235" y="87" class="ftext">O₂</text>
  <rect x="380" y="140" width="70" height="34" class="fmet"/>
  <text x="415" y="157" class="ftext">Pyr</text>
  <rect x="560" y="70" width="70" height="34" class="fmet"/>
  <text x="595" y="87" class="ftext">ATP</text>
  <rect x="560" y="240" width="70" height="34" class="fmet"/>
  <text x="595" y="257" class="ftext">Lac</text>
  <rect x="200" y="180" width="70" height="34" class="fmet"/>
  <text x="235" y="197" class="ftext">Glc</text>

  <!-- uptake arrows -->
  <line x1="100" y1="87" x2="200" y2="87" stroke="black" stroke-width="1.5" marker-end="url(#farrow)"/>
  <text x="150" y="72" class="fsmall">v₂ (oxygen uptake)</text>
  <line x1="100" y1="197" x2="200" y2="197" stroke="black" stroke-width="1.5" marker-end="url(#farrow)"/>
  <text x="150" y="182" class="fsmall">v₁ (glucose uptake)</text>

  <!-- glycolysis -->
  <line x1="270" y1="192" x2="380" y2="164" stroke="black" stroke-width="1.5" marker-end="url(#farrow)"/>
  <text x="300" y="212" class="fsmall">v₃ glycolysis</text>
  <text x="300" y="227" class="fsmall">Glc → 2 Pyr + 2 ATP</text>

  <!-- respiration -->
  <line x1="450" y1="145" x2="560" y2="95" stroke="black" stroke-width="1.5" marker-end="url(#farrow)"/>
  <text x="545" y="155" class="fsmall">v₄ respiration</text>
  <text x="545" y="170" class="fsmall">Pyr + 3 O₂ → 15 ATP</text>
  <line x1="270" y1="95" x2="502" y2="120" stroke="#888" stroke-width="1.2" marker-end="url(#farrow)"/>

  <!-- fermentation (two isozymes) -->
  <path d="M448 168 C490 198, 520 225, 560 248" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#farrow)"/>
  <path d="M440 174 C470 215, 500 242, 556 259" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#farrow)"/>
  <text x="425" y="255" class="fsmall">v₅, v₆ fermentation</text>
  <text x="425" y="270" class="fsmall">(two isozymes)</text>
  <text x="425" y="285" class="fsmall">Pyr → Lac</text>

  <!-- secretion + ATP drain -->
  <line x1="630" y1="257" x2="760" y2="257" stroke="black" stroke-width="1.5" marker-end="url(#farrow)"/>
  <text x="695" y="242" class="fsmall">v₇ (lactate secretion)</text>
  <line x1="630" y1="87" x2="760" y2="87" stroke="black" stroke-width="1.5" marker-end="url(#farrow)"/>
  <text x="695" y="72" class="fsmall">v₈ (ATP demand)</text>
</svg>