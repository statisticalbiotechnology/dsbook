name: deploy-book

on:
  push:
    branches:
    - master
    - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install mystmd CLI
      run: npm install -g mystmd

    - name: Install dependencies
      run: |
        pip install -r dsbook/requirements.txt

    - name: Cache executed notebooks
      uses: actions/cache@v4
      with:
        path: dsbook/_build/cache
        key: jupyter-book-cache-${{ hashFiles('dsbook/requirements.txt') }}

    - name: Build the book
      working-directory: dsbook
      env:
        BASE_URL: /dsbook
      run: |
        myst build --html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "dsbook/_build/html"

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
